name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Quality and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Report tool versions
        run: |
          java -version
          flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate database sources
        run: dart run build_runner build

      - name: Verify generated sources are current
        run: >-
          git diff --exit-code --
          lib/l10n/generated
          lib/core/database/app_database.g.dart
          pubspec.lock

      - name: Validate anatomy asset budgets
        run: >-
          python3 tool/anatomy/validate_asset_budgets.py
          --budget tool/anatomy/anatomy_asset_budgets.v1.json
          --scan-repository .

      - name: Validate anatomy animation contract
        run: >-
          python3 tool/anatomy/animation/validate_animation_contract.py
          --rig tool/anatomy/animation/shared_humanoid_rig.v1.json
          --animations tool/anatomy/animation/core_exercise_animation_prototypes.v1.json
          --ontology tool/anatomy/muscle_region_ontology.v1.json

      - name: Validate compound exercise animation contract
        run: >-
          python3 tool/anatomy/animation/validate_animation_contract.py
          --rig tool/anatomy/animation/shared_humanoid_rig.v1.json
          --animations tool/anatomy/animation/compound_exercise_animation_prototypes.v1.json
          --ontology tool/anatomy/muscle_region_ontology.v1.json
          --expected-exercise-count 30

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        with:
          name: project-atlas-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: project-atlas-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
